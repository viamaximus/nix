[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"

# ---------------------------------------------------------------------------
# Target: RP2040 (Raspberry Pi Pico / Pico W).
#
# To retarget, swap `embassy-rp` for the HAL of your chip and update
# .cargo/config.toml (build target + probe-rs --chip) and build.rs:
#   STM32  -> embassy-stm32 = { features = ["stm32g431cb", ...] }, thumbv7em-none-eabihf
#   nRF    -> embassy-nrf   = { features = ["nrf52840", ...] },    thumbv7em-none-eabihf
#   ESP32  -> esp-hal + esp-hal-embassy (different toolchain entirely)
# Only the HAL line changes; embassy-executor/time/sync are chip-agnostic.
# ---------------------------------------------------------------------------

[dependencies]
# NOTE: 0.10 renamed the arch feature `arch-cortex-m` -> `platform-cortex-m`.
embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "executor-thread",
  "executor-interrupt",
  "defmt",
] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = "0.1"
embassy-rp = { version = "0.10", features = [
  "rp2040",
  "rt",
  "time-driver",
  "critical-section-impl",
  "defmt",
  "unstable-pac",
] }

cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"

# Logging over RTT and a panic handler that reports through defmt. Both are
# linked for their side effects only, hence the `as _` imports in main.rs.
defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.dev]
# opt-level 0 is usually too slow and too large to fit on a microcontroller.
opt-level = "s"
debug = 2

[profile.release]
# Keep debug info: it costs nothing on the device (it stays in the ELF, not
# the flashed image) and defmt/probe-rs need it for symbols and backtraces.
debug = 2
lto = "fat"
opt-level = "s"
